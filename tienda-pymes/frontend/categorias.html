<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Pymes - Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="styles.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Tienda Pymes · Categorías</span>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="index.html"><i class="fa-solid fa-shirt me-1" aria-hidden="true"></i>Productos</a>
        <a class="btn btn-sm btn-light" href="categorias.html"><i class="fa-solid fa-tags me-1" aria-hidden="true"></i>Categorías</a>
        <a class="btn btn-sm btn-outline-light" href="reportes.html"><i class="fa-solid fa-chart-column me-1" aria-hidden="true"></i>Reportes</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="mensaje"></div>

    <div class="row g-4">
      <!-- Formulario agregar / editar -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header" id="tituloForm">Agregar categoría</div>
          <div class="card-body">
            <form id="formCategoria" novalidate>
              <input type="hidden" id="categoriaId" />

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="mb-3">
                <label for="padreId" class="form-label">Categoría padre (opcional)</label>
                <select class="form-select" id="padreId">
                  <option value="">Ninguna</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i>Guardar</button>
              <button type="button" class="btn btn-outline-secondary" id="btnCancelar"><i class="fa-solid fa-xmark me-1" aria-hidden="true"></i>Cancelar</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabla dinámica -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header">Categorías</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Categoría padre</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaCategorias"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="categorias.js"></script>
</body>
</html>
