<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Pymes - Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Tienda Pymes · Reportes</span>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="categorias.html">Categorías</a>
        <a class="btn btn-sm btn-outline-light" href="index.html">Volver a productos</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="h4 mb-3">Reportes</h1>
    <div id="mensaje"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 align-items-end">
          <button type="button" class="btn btn-primary" data-reporte="resumen">Resumen</button>
          <button type="button" class="btn btn-primary" data-reporte="productos-por-categoria">
            Productos por categoría
          </button>
          <button type="button" class="btn btn-primary" data-reporte="stock-por-producto">
            Stock por producto
          </button>
          <button type="button" class="btn btn-primary" data-reporte="precio-por-categoria">
            Precio por categoría
          </button>
          <button type="button" class="btn btn-primary" data-reporte="pedidos-por-estado">
            Pedidos por estado
          </button>

          <div class="d-flex gap-2 align-items-end">
            <div>
              <label for="limite" class="form-label mb-1">Límite</label>
              <input type="number" class="form-control" id="limite" min="0" value="5" style="width: 7rem" />
            </div>
            <button type="button" class="btn btn-primary" data-reporte="stock-bajo">Stock bajo</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header" id="tituloReporte">Elija un reporte</div>
      <div class="table-responsive" id="tabla"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="reportes.js"></script>
</body>
</html>
