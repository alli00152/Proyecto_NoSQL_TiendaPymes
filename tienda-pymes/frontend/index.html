<!DOCTYPE html>
<!-- ROL 3 (Front-End / UI): mantener los id del Contrato C; el diseño es libre -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Pymes - Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="styles.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Tienda Pymes · Administración</span>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="categorias.html"><i class="fa-solid fa-tags me-1" aria-hidden="true"></i>Categorías</a>
        <a class="btn btn-sm btn-outline-light" href="reportes.html"><i class="fa-solid fa-chart-column me-1" aria-hidden="true"></i>Ver reportes</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="mensaje"></div>

    <div class="row g-4">
      <!-- Formulario agregar / editar -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header" id="tituloForm">Agregar producto</div>
          <div class="card-body">
            <form id="formProducto" novalidate>
              <input type="hidden" id="productoId" />

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="2"></textarea>
              </div>
              <div class="mb-3">
                <label for="precio" class="form-label">Precio (₡)</label>
                <input type="number" class="form-control" id="precio" min="0" step="1" required />
              </div>
              <div class="mb-3">
                <label for="categoriaId" class="form-label">Categoría</label>
                <select class="form-select" id="categoriaId">
                  <option value="">Sin categoría</option>
                </select>
              </div>
              <div class="row">
                <div class="col-3 mb-3">
                  <label for="sku" class="form-label">SKU</label>
                  <input type="text" class="form-control" id="sku" />
                </div>
                <div class="col-3 mb-3">
                  <label for="talla" class="form-label">Talla</label>
                  <input type="text" class="form-control" id="talla" />
                </div>
                <div class="col-3 mb-3">
                  <label for="color" class="form-label">Color</label>
                  <input type="text" class="form-control" id="color" />
                </div>
                <div class="col-3 mb-3">
                  <label for="stock" class="form-label">Stock</label>
                  <input type="number" class="form-control" id="stock" min="0" value="0" />
                </div>
              </div>
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="activo" checked />
                <label class="form-check-label" for="activo">Activo</label>
              </div>

              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i>Guardar</button>
              <button type="button" class="btn btn-outline-secondary" id="btnCancelar"><i class="fa-solid fa-xmark me-1" aria-hidden="true"></i>Cancelar</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabla dinámica -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header">Productos</div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Variante</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaProductos"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
